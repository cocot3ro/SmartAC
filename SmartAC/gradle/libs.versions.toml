libres = { id = "io.github.skeptick.libres", version.ref = "libres" }


[bundles]
koin-server = [
    "koin-ktor",
    "koin-annotations",
    "koin-logger-slf4j"
]

koin-client = [
    "koin-core",
    "koin-compose",
    "koin-compose-viewmodel",
    "koin-annotations"
]

